<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dither Algorithm Comparison</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">

    <div id="mainContent">
        <div id="leftPanel">
            <h2>Dither Comparer</h2>
            <div id="buttonGroup">
                <button class="primary" onclick="document.getElementById('fileInput').click()">Load Images</button>
                <button onclick="showResults()">Show Results</button>
            </div>
            <div id="imageInfo"></div>
            <h3>Images</h3>
            <div id="imageList"></div>
        </div>

        <div id="middlePanel">
            <h2>Source Image</h2>
            <canvas id="sourceCanvas"></canvas>
            <div id="votingButtonGroup">
                <button onclick="submitVote()">Submit Vote</button>
                <button onclick="clearVote()">Clear Vote</button>
            </div>
        </div>
        
        <div id="rightPanel">
            <h2 id="confTitle" style="align-self: center;"></h2>
            <div id="viewWrapper">
                <button id="prevBtn">◀</button>
                <div id="ditheredView"></div>
                <div id="sourceView" class="canvas-container hidden">
                    <canvas></canvas>
                    <p>Source img</p>
                </div>
                <div id="mappedView" class="canvas-container hidden">
                    <canvas></canvas>
                    <p>Mapped image (no dithering)</p>
                </div>
                <div id="inGammutView" class="canvas-container hidden">
                    <canvas></canvas>
                    <p>In-gammut pixels</p>
                </div>
                <button id="nextBtn">▶</button>
            </div>
            <div id="carouselThumbs"></div>
        </div>
    </div>

    <div id="resultsModal">
        <div id="resultsContent">
            <h2>Voting Results</h2>
            <div id="resultsData"></div>
            <button style="margin-top: 20px;" onclick="closeResults()">Close</button>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
